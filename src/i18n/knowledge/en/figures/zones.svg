<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" aria-hidden="true">
  <text x="0" y="14" font-size="13" style="fill:var(--color-text-secondary)">Share of maximum heart rate</text>
  <rect x="0" y="26" width="66" height="14" rx="4" style="fill:var(--color-primary-soft)"/>
  <text x="0" y="66" font-size="13" style="fill:var(--color-text)">Zone 1</text>
  <text x="0" y="83" font-size="13" style="fill:var(--color-text-secondary)">50–60 %</text>
  <rect x="68" y="26" width="66" height="20" rx="4" style="fill:var(--color-primary)"/>
  <text x="68" y="66" font-size="13" font-weight="600" style="fill:var(--color-text)">Zone 2</text>
  <text x="68" y="83" font-size="13" style="fill:var(--color-text-secondary)">60–70 %</text>
  <rect x="136" y="26" width="66" height="14" rx="4" style="fill:var(--color-primary-soft)"/>
  <text x="136" y="66" font-size="13" style="fill:var(--color-text)">Zone 3</text>
  <text x="136" y="83" font-size="13" style="fill:var(--color-text-secondary)">70–80 %</text>
  <rect x="204" y="26" width="66" height="14" rx="4" style="fill:var(--color-primary-soft)"/>
  <text x="204" y="66" font-size="13" style="fill:var(--color-text)">Zone 4</text>
  <text x="204" y="83" font-size="13" style="fill:var(--color-text-secondary)">80–90 %</text>
  <rect x="272" y="26" width="66" height="14" rx="4" style="fill:var(--color-primary-soft)"/>
  <text x="272" y="66" font-size="13" style="fill:var(--color-text)">Zone 5</text>
  <text x="272" y="83" font-size="13" style="fill:var(--color-text-secondary)">90–100 %</text>
  <text x="0" y="112" font-size="14" style="fill:var(--color-text)">Zone 2: you can still talk in full sentences</text>
</svg>
