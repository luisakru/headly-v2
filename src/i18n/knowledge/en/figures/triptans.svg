  <text x="0" y="70" font-size="14" style="fill:var(--color-text)">Rizatriptan</text>
  <rect x="104" y="60" width="13.8" height="12" rx="4" style="fill:var(--color-primary)"/>
  <text x="123.846" y="70" font-size="13" style="fill:var(--color-text-secondary)">2 h</text>
  <text x="0" y="100" font-size="14" style="fill:var(--color-text)">Zolmitriptan</text>
